name: build

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [ published ]

jobs:
  dylib:
    name: build FragUnlock.dylib (arm64 iOS, linux theos)
    runs-on: ubuntu-22.04

    env:
      THEOS: /opt/theos

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: apt deps
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential fakeroot rsync curl wget perl zip unzip git \
            libz-dev python3 ca-certificates xz-utils jq
          # libtinfo5 lives only in some ubuntu codenames — try, don't fail
          sudo apt-get install -y libtinfo5 || true

      - name: clone theos
        run: |
          set -eux
          sudo mkdir -p "$THEOS"
          sudo chown -R "$USER":"$USER" "$THEOS"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"

      - name: resolve + install darwin-targeting clang toolchain
        run: |
          set -eux
          mkdir -p "$THEOS/toolchain/linux/iphone"

          # Pull latest release asset matching an ubuntu linux toolchain.
          META="$(curl -fsSL https://api.github.com/repos/kabiroberai/swift-toolchain-linux/releases/latest)"
          echo "$META" | jq '.tag_name, (.assets[].name)'

          URL="$(echo "$META" | jq -r '.assets[] | select(.name|test("ubuntu.*(tar\\.xz|tar\\.gz)$")) | .browser_download_url' | head -1)"
          if [ -z "$URL" ]; then
            URL="https://github.com/kabiroberai/swift-toolchain-linux/releases/download/v2.1.0/swift-5.9-ubuntu22.04.tar.xz"
          fi
          echo "toolchain url: $URL"

          curl -fL --retry 3 -o /tmp/tc.tar "$URL"
          case "$URL" in
            *.tar.xz) tar -xf /tmp/tc.tar -C "$THEOS/toolchain/linux/iphone" --strip-components=1 ;;
            *.tar.gz) tar -xzf /tmp/tc.tar -C "$THEOS/toolchain/linux/iphone" --strip-components=1 ;;
          esac

          ls "$THEOS/toolchain/linux/iphone/bin" | head -20
          "$THEOS/toolchain/linux/iphone/bin/clang" --version || true

      - name: install iOS SDK
        run: |
          set -eux
          mkdir -p "$THEOS/sdks"
          git clone --depth=1 https://github.com/theos/sdks.git /tmp/sdks
          # Pick the newest iPhoneOS SDK present in the mirror.
          PICK="$(ls /tmp/sdks | grep -E '^iPhoneOS[0-9.]+\.sdk$' | sort -V | tail -1)"
          echo "picked SDK: $PICK"
          cp -R "/tmp/sdks/$PICK" "$THEOS/sdks/"
          echo "SDK_NAME=$PICK" >> "$GITHUB_ENV"

      - name: build dylib
        run: |
          set -eux
          export PATH="$THEOS/toolchain/linux/iphone/bin:$PATH"
          make -f Makefile info
          make -f Makefile clean || true
          make -f Makefile -j"$(nproc)" V=1
          ls -l FragUnlock.dylib
          file FragUnlock.dylib || true

      - name: stage artifact
        run: |
          mkdir -p dist
          cp FragUnlock.dylib dist/FragUnlock.dylib

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FragUnlock-dylib
          path: dist/FragUnlock.dylib
          if-no-files-found: error
          retention-days: 30

      - name: attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FragUnlock.dylib
