name: build

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [ published ]

jobs:
  dylib:
    name: build FragUnlock.dylib (arm64 iOS, linux theos)
    runs-on: ubuntu-22.04

    env:
      THEOS: /opt/theos

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: apt deps
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential fakeroot rsync curl wget perl zip unzip git \
            libz-dev python3 ca-certificates xz-utils jq
          # libtinfo5 lives only in some ubuntu codenames — try, don't fail
          sudo apt-get install -y libtinfo5 || true

      - name: clone theos
        run: |
          set -eux
          sudo mkdir -p "$THEOS"
          sudo chown -R "$USER":"$USER" "$THEOS"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"

      - name: install darwin-targeting clang toolchain
        run: |
          set -eux
          TC="$THEOS/toolchain/linux/iphone"
          mkdir -p "$TC"
          rm -rf /tmp/tcx
          mkdir -p /tmp/tcx

          # Try known-good sources in order until one unpacks a usable clang.
          URLS=(
            "https://github.com/kabiroberai/swift-toolchain-linux/releases/download/v2.1.0/swift-5.9-ubuntu22.04.tar.xz"
            "https://github.com/kabiroberai/swift-toolchain-linux/releases/download/v2.0.0/swift-5.8-ubuntu22.04.tar.xz"
            "https://github.com/kabiroberai/swift-toolchain-linux/releases/download/v1.0.1/swift-5.5-ubuntu20.04.tar.xz"
            "https://github.com/sbingner/llvm-project/releases/download/v10.0.0-1/linux-ios-arm64e-clang-toolchain.tar.lzma"
          )

          CLANG=""
          for URL in "${URLS[@]}"; do
            echo "::group::try $URL"
            rm -rf /tmp/tcx && mkdir -p /tmp/tcx
            if ! curl -fL --retry 3 -o /tmp/tc.bin "$URL"; then
              echo "fetch failed"; echo "::endgroup::"; continue
            fi
            case "$URL" in
              *.tar.xz)   tar -xf  /tmp/tc.bin -C /tmp/tcx || true ;;
              *.tar.gz)   tar -xzf /tmp/tc.bin -C /tmp/tcx || true ;;
              *.tar.lzma) (cd /tmp/tcx && lzcat /tmp/tc.bin | tar -xf -) || true ;;
            esac
            CLANG="$(find /tmp/tcx -type f -name 'clang++' -perm -u+x 2>/dev/null | head -1)"
            if [ -z "$CLANG" ]; then
              CLANG_C="$(find /tmp/tcx -type f -name 'clang' -perm -u+x 2>/dev/null | head -1)"
              [ -n "$CLANG_C" ] && CLANG="$CLANG_C"
            fi
            echo "::endgroup::"
            if [ -n "$CLANG" ]; then
              echo "picked toolchain: $URL"; break
            fi
          done

          if [ -z "$CLANG" ]; then
            echo "FATAL: no usable clang in any candidate tarball" >&2
            find /tmp/tcx -maxdepth 4 | head -50 >&2
            exit 1
          fi

          # Move the extracted root (the dir containing bin/ or usr/bin/) to $TC.
          SRC_ROOT="$(dirname "$(dirname "$CLANG")")"
          echo "src root: $SRC_ROOT"
          rsync -a "$SRC_ROOT/" "$TC/"

          # Normalize: clang needs to be at $TC/bin/clang[++] because Makefile
          # and theos convention expect that. If it only lives in usr/bin,
          # symlink everything over.
          if [ ! -x "$TC/bin/clang" ] && [ -x "$TC/usr/bin/clang" ]; then
            mkdir -p "$TC/bin"
            for f in "$TC/usr/bin/"*; do
              ln -sf "../usr/bin/$(basename "$f")" "$TC/bin/$(basename "$f")"
            done
          fi

          echo "---- bin ----"
          ls -l "$TC/bin" | head -30
          echo "---- clang version ----"
          "$TC/bin/clang" --version
          "$TC/bin/clang++" --version || true

      - name: install iOS SDK
        run: |
          set -eux
          mkdir -p "$THEOS/sdks"
          git clone --depth=1 https://github.com/theos/sdks.git /tmp/sdks
          # Pick the newest iPhoneOS SDK present in the mirror.
          PICK="$(ls /tmp/sdks | grep -E '^iPhoneOS[0-9.]+\.sdk$' | sort -V | tail -1)"
          echo "picked SDK: $PICK"
          cp -R "/tmp/sdks/$PICK" "$THEOS/sdks/"
          echo "SDK_NAME=$PICK" >> "$GITHUB_ENV"

      - name: build dylib
        run: |
          set -eux
          export PATH="$THEOS/toolchain/linux/iphone/bin:$PATH"
          make -f Makefile info
          make -f Makefile clean || true
          make -f Makefile -j"$(nproc)" V=1
          ls -l FragUnlock.dylib
          file FragUnlock.dylib || true

      - name: stage artifact
        run: |
          mkdir -p dist
          cp FragUnlock.dylib dist/FragUnlock.dylib

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FragUnlock-dylib
          path: dist/FragUnlock.dylib
          if-no-files-found: error
          retention-days: 30

      - name: attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FragUnlock.dylib
