name: build

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [ published ]

jobs:
  dylib:
    name: build FragUnlock.dylib (arm64 iOS, linux theos)
    runs-on: ubuntu-22.04

    env:
      THEOS: /opt/theos

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: apt deps
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential fakeroot rsync curl wget perl zip unzip git \
            libz-dev python3 ca-certificates xz-utils jq
          # libtinfo5 lives only in some ubuntu codenames — try, don't fail
          sudo apt-get install -y libtinfo5 || true

      - name: clone theos
        run: |
          set -eux
          sudo mkdir -p "$THEOS"
          sudo chown -R "$USER":"$USER" "$THEOS"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"

      - name: install darwin-targeting clang toolchain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          TC="$THEOS/toolchain/linux/iphone"
          mkdir -p "$TC"

          # Query GitHub's release API for whatever's actually live right now.
          # Preference order: kabiroberai swift-toolchain (newest clang/swift
          # darwin cross build), then sbingner llvm-project (older but proven).
          REPOS=(
            "kabiroberai/swift-toolchain-linux"
            "sbingner/llvm-project"
          )

          # Collect every candidate asset URL from the latest release of each.
          CANDIDATES=()
          for REPO in "${REPOS[@]}"; do
            echo "::group::query $REPO"
            META="$(curl -fsSL -H 'Accept: application/vnd.github+json' \
                    -H "Authorization: Bearer $GH_TOKEN" \
                    "https://api.github.com/repos/$REPO/releases/latest" || echo '{}')"
            echo "$META" | jq -r '.tag_name, (.assets[]?.name)'
            while IFS= read -r U; do
              [ -n "$U" ] && CANDIDATES+=("$U")
            done < <(echo "$META" | jq -r \
              '.assets[]?.browser_download_url
               | select(test("\\.(tar\\.xz|tar\\.gz|tar\\.lzma|tar\\.bz2|tar)$"))')
            echo "::endgroup::"
          done
          echo "candidates: ${#CANDIDATES[@]}"
          printf '  - %s\n' "${CANDIDATES[@]}"

          # Try each candidate: download, extract, probe for clang.
          CLANG=""
          for URL in "${CANDIDATES[@]}"; do
            echo "::group::try $URL"
            rm -rf /tmp/tcx && mkdir -p /tmp/tcx
            if ! curl -fL --retry 3 -o /tmp/tc.bin "$URL"; then
              echo "fetch failed"; echo "::endgroup::"; continue
            fi
            case "$URL" in
              *.tar.xz)   tar -xf  /tmp/tc.bin -C /tmp/tcx || true ;;
              *.tar.gz)   tar -xzf /tmp/tc.bin -C /tmp/tcx || true ;;
              *.tar.bz2)  tar -xjf /tmp/tc.bin -C /tmp/tcx || true ;;
              *.tar.lzma) (cd /tmp/tcx && lzcat /tmp/tc.bin | tar -xf -) || true ;;
              *.tar)      tar -xf  /tmp/tc.bin -C /tmp/tcx || true ;;
            esac
            CLANG="$(find /tmp/tcx -type f \( -name 'clang++' -o -name 'clang' \) \
                     -perm -u+x 2>/dev/null | head -1)"
            echo "::endgroup::"
            if [ -n "$CLANG" ]; then echo "picked: $URL"; break; fi
          done

          if [ -z "$CLANG" ]; then
            echo "FATAL: no candidate tarball contained clang" >&2
            echo "last extract tree:" >&2
            find /tmp/tcx -maxdepth 4 2>/dev/null | head -60 >&2
            exit 1
          fi

          # Install: extracted root is the dir two levels above the clang bin.
          SRC_ROOT="$(dirname "$(dirname "$CLANG")")"
          echo "src root: $SRC_ROOT"
          rsync -a "$SRC_ROOT/" "$TC/"

          # Normalize: ensure clang[++] is reachable at $TC/bin/.
          if [ ! -x "$TC/bin/clang" ] && [ -x "$TC/usr/bin/clang" ]; then
            mkdir -p "$TC/bin"
            for f in "$TC/usr/bin/"*; do
              ln -sf "../usr/bin/$(basename "$f")" "$TC/bin/$(basename "$f")"
            done
          fi
          # Some sbingner-style builds ship clang but not clang++; alias it.
          if [ -x "$TC/bin/clang" ] && [ ! -e "$TC/bin/clang++" ]; then
            ln -sf clang "$TC/bin/clang++"
          fi

          echo "---- bin ----"
          ls -l "$TC/bin" | head -40
          echo "---- clang version ----"
          "$TC/bin/clang"   --version
          "$TC/bin/clang++" --version

      - name: install iOS SDK
        run: |
          set -eux
          mkdir -p "$THEOS/sdks"
          git clone --depth=1 https://github.com/theos/sdks.git /tmp/sdks
          # Pick the newest iPhoneOS SDK present in the mirror.
          PICK="$(ls /tmp/sdks | grep -E '^iPhoneOS[0-9.]+\.sdk$' | sort -V | tail -1)"
          echo "picked SDK: $PICK"
          cp -R "/tmp/sdks/$PICK" "$THEOS/sdks/"
          echo "SDK_NAME=$PICK" >> "$GITHUB_ENV"

      - name: build dylib
        run: |
          set -eux
          export PATH="$THEOS/toolchain/linux/iphone/bin:$PATH"
          make -f Makefile info
          make -f Makefile clean || true
          make -f Makefile -j"$(nproc)" V=1
          ls -l FragUnlock.dylib
          file FragUnlock.dylib || true

      - name: stage artifact
        run: |
          mkdir -p dist
          cp FragUnlock.dylib dist/FragUnlock.dylib

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FragUnlock-dylib
          path: dist/FragUnlock.dylib
          if-no-files-found: error
          retention-days: 30

      - name: attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FragUnlock.dylib
